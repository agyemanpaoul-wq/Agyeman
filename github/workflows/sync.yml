name: Sync Garmin

on:
  schedule:
    - cron: "15 6 * * *"
    - cron: "30 9 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Giorni da sincronizzare (60 per il primo caricamento)"
        default: "3"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r sync/requirements.txt
      - run: python sync/garmin_sync.py
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DAYS: ${{ github.event.inputs.days || '3' }}
